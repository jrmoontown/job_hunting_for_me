name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 20분마다 Gist의 현황 요약(status.md)을 다시 가져와 사이트에 반영한다
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 앱이 Gist에 저장한 현황 요약(status.md)을 추측할 수 없는 경로(s/<키>.md)로 사이트에 함께 올린다.
      # 키는 sha256(GIST_ID) 앞 16자리 — 앱 설정 화면이 같은 방식으로 링크를 만든다.
      # 저장소 시크릿 GIST_ID 가 없으면 이 단계는 건너뛴다.
      - name: 현황 요약 가져오기
        id: status
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          OWNER: ${{ github.repository_owner }}
          REPO_FULL: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "skip=false" >> "$GITHUB_OUTPUT"
          REPO="${REPO_FULL#*/}"
          if [ -z "$GIST_ID" ]; then
            echo "GIST_ID 시크릿이 없어 현황 요약은 올리지 않습니다."
            [ "$EVENT" = "schedule" ] && echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          key=$(printf '%s' "$GIST_ID" | sha256sum | cut -c1-16)
          mkdir -p s
          if ! curl -fsSL "https://gist.githubusercontent.com/$OWNER/$GIST_ID/raw/status.md" -o "s/$key.md"; then
            echo "::warning::Gist에서 status.md 를 가져오지 못했습니다. GIST_ID 가 맞는지, 앱에서 동기화가 한 번이라도 됐는지 확인하세요."
            rm -rf s
            [ "$EVENT" = "schedule" ] && echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "현황 요약을 s/$key.md 로 준비했습니다 ($(wc -c < "s/$key.md") bytes)"
          # 예약 실행일 때 이미 올라간 내용과 같으면 배포를 건너뛴다 (Pages 배포 횟수 절약)
          if [ "$EVENT" = "schedule" ]; then
            live=$(curl -fsSL "https://$OWNER.github.io/$REPO/s/$key.md" || true)
            if [ -n "$live" ] && [ "$live" = "$(cat "s/$key.md")" ]; then
              echo "변경 없음 — 배포를 건너뜁니다"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - if: steps.status.outputs.skip != 'true'
        uses: actions/configure-pages@v5
      - if: steps.status.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - if: steps.status.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
